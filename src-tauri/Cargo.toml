[package]
name = "texypaper"
version = "0.0.8"
edition = "2024"
repository = "https://github.com/HSoo-Kim/texypaper"
license = "MIT"
[lib]
name = "texypaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "~2.12.5", features = ["tray-icon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
flate2 = "1"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
rand = "0.9"
regex = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
base64 = "0.22"
rfd = { version = "0.15", default-features = false }
jsonschema = { version = "0.46", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
spellbook = "=0.4.2"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
[dev-dependencies]
tempfile = "3"
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
