name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0; version from packageManager
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Windows Rust format, clippy and tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install stable MSVC Rust with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$(rustc --version)" >> $env:GITHUB_OUTPUT
        id: rust
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Show external test dependencies and explicit coverage exclusions
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'execution::tests uses the installed Python 3.12 and native Windows Job Objects.'
          Write-Output 'spell::tests::selected_engine_returns_utf16_spans uses Windows English dictionaries when available, otherwise the shipped dictionary; bundled-engine tests always run.'
          Write-Output 'SKIP observed_cp949_input_paths_decode_strictly_on_cp949_windows: requires Windows ANSI code page 949; hosted Windows uses a different code page. No OS locale changes are made.'
          Write-Output 'SKIP real-app smoke: smoke-desktop, smoke-preferences, smoke-usability, smoke-features, smoke-ssh, smoke-agents, smoke-chat, smoke-tray and measure-memory require a permitted interactive desktop, WebView2 and/or authenticated providers. TeX build smoke additionally needs latexmk/pdfLaTeX/SyncTeX (Windows TeX Live for local, POSIX TeX for SSH); SSH smoke needs WSL/OpenSSH. See docs/DEVELOPMENT.md.'
          Write-Output 'Platform exclusions: cfg(unix) Rust symlink tests are not compiled on Windows; remote_*.py exercises POSIX worker filesystem/process ownership on Ubuntu in the python-worker job.'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --skip observed_cp949_input_paths_decode_strictly_on_cp949_windows

  python-worker:
    name: POSIX Python worker regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run every remote worker test with isolated POSIX Python
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(src-tauri/tests/remote_*.py)
          if (( ${#tests[@]} == 0 )); then
            echo 'No remote worker tests found' >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "::group::$test (POSIX Python; no WSL or TeX required)"
            python3 -I -B "$test" -v
            echo '::endgroup::'
          done
